services:
  - type: web
    name: mrp-portal-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_TENANT_EMAIL
        sync: false
      - key: BOOTSTRAP_TENANT_PASSWORD
        sync: false
      - key: BOOTSTRAP_PLATFORM_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_PLATFORM_ADMIN_PASSWORD
        sync: false
