<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Where to upload and verify MRP data in the portal</title><desc id="desc">Illustrative screen maps for Master Data upload, Demand Planning upload, Dashboard run controls, and Material Requirement results.</desc>
  <rect width="1200" height="610" rx="22" fill="#f5f8fc"/><text x="40" y="48" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#173154">Portal screen map</text><text x="40" y="74" font-family="Segoe UI,Arial" font-size="14" fill="#64748b">Illustrations of the controls to look for; exact data and counts depend on your upload.</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(36 105)"><rect width="552" height="210" rx="14" fill="#fff" stroke="#d5dfec"/><rect width="552" height="32" rx="14" fill="#183153"/><text x="18" y="22" font-size="13" font-weight="700" fill="#fff">MRP PORTAL  /  MASTER DATA</text><text x="20" y="64" font-size="20" font-weight="700" fill="#173154">Master Data</text><text x="20" y="87" font-size="12" fill="#64748b">Maintain the planning records and rules used by MRP.</text><rect x="20" y="108" width="240" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text x="34" y="131" font-size="11" fill="#64748b">UPLOAD TYPE</text><rect x="34" y="140" width="155" height="27" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="44" y="158" font-size="12" fill="#334155">Plant master   ▾</text><rect x="278" y="128" width="138" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="297" y="152" font-size="12" font-weight="600" fill="#334155">↑  Upload CSV</text><rect x="20" y="184" width="512" height="14" rx="6" fill="#eff6ff"/><text x="28" y="195" font-size="10" fill="#1d4ed8">Choose the matching upload type before selecting each file.</text><circle cx="482" cy="148" r="16" fill="#dbeafe"/><text x="482" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">1</text></g>
    <g transform="translate(612 105)"><rect width="552" height="210" rx="14" fill="#fff" stroke="#d5dfec"/><rect width="552" height="32" rx="14" fill="#183153"/><text x="18" y="22" font-size="13" font-weight="700" fill="#fff">MRP PORTAL  /  DEMAND PLANNING</text><text x="20" y="64" font-size="20" font-weight="700" fill="#173154">Demand Planning</text><text x="20" y="87" font-size="12" fill="#64748b">Import the demand buckets used to calculate material needs.</text><rect x="20" y="108" width="252" height="70" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text x="34" y="131" font-size="11" fill="#64748b">UPLOAD TYPE</text><rect x="34" y="140" width="190" height="27" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="44" y="158" font-size="12" fill="#334155">Weekly demand forecast   ▾</text><rect x="290" y="128" width="138" height="38" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="309" y="152" font-size="12" font-weight="600" fill="#334155">↑  Upload CSV</text><circle cx="482" cy="148" r="16" fill="#ede9fe"/><text x="482" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">2</text><text x="20" y="197" font-size="11" fill="#64748b">A success message reports how many rows were uploaded.</text></g>
    <g transform="translate(36 340)"><rect width="552" height="220" rx="14" fill="#fff" stroke="#d5dfec"/><rect width="552" height="32" rx="14" fill="#183153"/><text x="18" y="22" font-size="13" font-weight="700" fill="#fff">MRP PORTAL  /  DASHBOARD</text><text x="20" y="64" font-size="20" font-weight="700" fill="#173154">Forward MRP</text><text x="20" y="87" font-size="12" fill="#64748b">Set the planning scope before calculating.</text><text x="20" y="118" font-size="11" fill="#64748b">COUNTRY</text><rect x="20" y="126" width="116" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="30" y="145" font-size="12" fill="#334155">Morocco ▾</text><text x="151" y="118" font-size="11" fill="#64748b">HORIZON</text><rect x="151" y="126" width="92" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="161" y="145" font-size="12" fill="#334155">3 months ▾</text><text x="258" y="118" font-size="11" fill="#64748b">TIME BUCKETS</text><rect x="258" y="126" width="100" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="268" y="145" font-size="12" fill="#334155">Weekly ▾</text><text x="373" y="118" font-size="11" fill="#64748b">START DATE</text><rect x="373" y="126" width="145" height="28" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="383" y="145" font-size="12" fill="#334155">2026-11-01</text><rect x="20" y="169" width="118" height="34" rx="7" fill="#2563eb"/><text x="39" y="191" font-size="12" font-weight="700" fill="#fff">▶  Run MRP</text><circle cx="489" cy="185" r="16" fill="#dcfce7"/><text x="489" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">3</text></g>
    <g transform="translate(612 340)"><rect width="552" height="220" rx="14" fill="#fff" stroke="#d5dfec"/><rect width="552" height="32" rx="14" fill="#183153"/><text x="18" y="22" font-size="13" font-weight="700" fill="#fff">MRP PORTAL  /  MATERIAL REQUIREMENT</text><text x="20" y="64" font-size="20" font-weight="700" fill="#173154">Material Requirement</text><text x="20" y="87" font-size="12" fill="#64748b">Review the saved result from the latest MRP calculation.</text><g font-size="10" font-weight="700" fill="#475569"><text x="20" y="119">PERIOD</text><text x="105" y="119">MATERIAL</text><text x="222" y="119">REQUIRED</text><text x="302" y="119">AVAILABLE</text><text x="390" y="119">NET NEED</text><text x="468" y="119">SUGGESTED PO</text></g><path d="M20 128h510M20 166h510M20 204h510" stroke="#e2e8f0"/><g font-size="11" fill="#334155"><text x="20" y="151">Nov 2026</text><text x="105" y="151">RM01 · Clinker</text><text x="222" y="151">Gross need</text><text x="302" y="151">Stock + receipts</text><text x="390" y="151">After netting</text><text x="468" y="151">Order amount</text></g><rect x="18" y="174" width="514" height="26" rx="5" fill="#eff6ff"/><text x="28" y="192" font-size="10" fill="#1d4ed8">Check period, material, UOM, quantity, and status.</text><circle cx="510" cy="186" r="15" fill="#dbeafe"/><text x="510" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">4</text></g>
  </g>
</svg>
