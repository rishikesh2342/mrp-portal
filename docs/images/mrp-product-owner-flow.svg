<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MRP planning flow</title><desc id="desc">Upload planning data in order, calculate on the dashboard, then review material requirements.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7185a5"/></marker></defs>
  <rect width="1200" height="430" rx="24" fill="#f5f8fc"/>
  <text x="44" y="52" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#173154">MRP: from planning data to a material plan</text>
  <text x="44" y="80" font-family="Segoe UI,Arial" font-size="15" fill="#64748b">Upload each file in its matching screen. Then calculate and review the result.</text>
  <g font-family="Segoe UI,Arial">
    <g transform="translate(38 130)"><rect width="250" height="230" rx="16" fill="#fff" stroke="#dbe4ef"/><circle cx="28" cy="30" r="16" fill="#2563eb"/><text x="28" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="54" y="35" font-size="18" font-weight="700" fill="#173154">Master Data</text><text x="20" y="77" font-size="14" fill="#43546d">Upload in this order:</text><text x="20" y="108" font-size="14" fill="#43546d">• Plant master</text><text x="20" y="135" font-size="14" fill="#43546d">• Material master</text><text x="20" y="162" font-size="14" fill="#43546d">• Finished goods</text><text x="20" y="189" font-size="14" fill="#43546d">• Plant constraints</text><text x="20" y="216" font-size="14" fill="#43546d">• Bill of materials</text></g>
    <path d="M292 245h28" stroke="#7185a5" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(330 130)"><rect width="240" height="230" rx="16" fill="#fff" stroke="#dbe4ef"/><circle cx="28" cy="30" r="16" fill="#0891b2"/><text x="28" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="54" y="35" font-size="18" font-weight="700" fill="#173154">Inventory</text><text x="20" y="82" font-size="14" fill="#43546d">Upload Inventory &amp; stock</text><text x="20" y="111" font-size="14" fill="#43546d">Opening on-hand quantities</text><text x="20" y="140" font-size="14" fill="#43546d">Reserved and in-transit stock</text><text x="20" y="169" font-size="14" fill="#43546d">Scheduled receipts</text><rect x="18" y="188" width="203" height="25" rx="7" fill="#fff7ed"/><text x="28" y="206" font-size="12" fill="#9a4d0c">Use the same plant/material codes</text></g>
    <path d="M574 245h28" stroke="#7185a5" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(612 130)"><rect width="240" height="230" rx="16" fill="#fff" stroke="#dbe4ef"/><circle cx="28" cy="30" r="16" fill="#7c3aed"/><text x="28" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="54" y="35" font-size="18" font-weight="700" fill="#173154">Demand Planning</text><text x="20" y="82" font-size="14" fill="#43546d">Upload Weekly demand forecast</text><text x="20" y="111" font-size="14" fill="#43546d">One row per plant, product, week</text><text x="20" y="140" font-size="14" fill="#43546d">Forecast quantity in the product UOM</text><text x="20" y="169" font-size="14" fill="#43546d">Weekly dates must be Sundays</text><rect x="18" y="188" width="203" height="25" rx="7" fill="#f5f3ff"/><text x="28" y="206" font-size="12" fill="#5b21b6">No Excel workbook upload</text></g>
    <path d="M856 245h28" stroke="#7185a5" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(894 130)"><rect width="268" height="230" rx="16" fill="#fff" stroke="#dbe4ef"/><circle cx="28" cy="30" r="16" fill="#059669"/><text x="28" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="54" y="35" font-size="18" font-weight="700" fill="#173154">Calculate &amp; Review</text><text x="20" y="82" font-size="14" fill="#43546d">Dashboard → choose scope and dates</text><text x="20" y="111" font-size="14" fill="#43546d">Click Run MRP</text><text x="20" y="140" font-size="14" fill="#43546d">Check totals and exceptions</text><text x="20" y="169" font-size="14" fill="#43546d">Material Requirement → inspect rows</text><rect x="18" y="188" width="232" height="25" rx="7" fill="#ecfdf5"/><text x="28" y="206" font-size="12" fill="#047857">Save the run date / result for review</text></g>
  </g>
</svg>
